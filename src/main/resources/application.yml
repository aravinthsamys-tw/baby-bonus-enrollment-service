spring:
  application:
    name: baby-bonus-enrollment-service
  datasource:
    url: jdbc:h2:mem:baby_bonus;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

server:
  port: 8080

baby-bonus:
  auth:
    api-key: ${BABY_BONUS_API_KEY:}
    caller-identity: ${BABY_BONUS_CALLER_ID:baby-bonus-api-client}
