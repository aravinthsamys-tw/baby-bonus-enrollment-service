name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: baby-bonus-enrollment-service
  IMAGE_NAME: baby-bonus-enrollment-service

jobs:
  verify-build-publish:
    name: Test, Build, Publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew --no-daemon test

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME:$GITHUB_SHA" .

      - name: Resolve ECR publishing configuration
        id: ecr
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "$AWS_ACCOUNT_ID" ] && [ -n "$AWS_ROLE_TO_ASSUME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: ${{ steps.ecr.outputs.enabled == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Log in to Amazon ECR
        if: ${{ steps.ecr.outputs.enabled == 'true' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to Amazon ECR
        if: ${{ steps.ecr.outputs.enabled == 'true' }}
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
